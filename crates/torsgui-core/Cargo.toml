[package]
name = "torsgui-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cozy-chess = "0.3.4"
dirs = "7.0.0"
evalexpr = "13.1.0"
flate2 = "1.1.10"
hex = "0.4.3"
log = "0.4.34"
once_cell = "1.21.4"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust = "0.6.1"
sha2 = "0.11.0"
strsim = "0.11.1"
sysinfo = "0.38.4"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "0.9"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Power"] }
