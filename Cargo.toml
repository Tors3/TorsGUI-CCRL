[workspace]
resolver = "2"
members = ["crates/torsgui-core", "crates/torsgui-runner", "crates/mock-uci"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["TorsGUI contributors"]
repository = "https://github.com/Tors3/TorsGUI"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
