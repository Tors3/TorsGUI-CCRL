[workspace]
resolver = "2"
members = ["crates/torsgui-core", "crates/torsgui-runner", "crates/torsgui-server", "crates/mock-uci", "src-tauri"]
# the desktop shell needs the WebView toolchain: build it with `npm run tauri build`
default-members = ["crates/torsgui-core", "crates/torsgui-runner", "crates/torsgui-server", "crates/mock-uci"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["TorsGUI contributors"]
repository = "https://github.com/Tors3/TorsGUI"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
