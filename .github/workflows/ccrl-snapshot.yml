name: CCRL snapshot

# Downloads the raw HTML of the CCRL rating lists into src-tauri/resources/ccrl/
# (bundled with TorsGUI as an offline copy) and commits it to main.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the lists
        run: |
          set -u
          out=src-tauri/resources/ccrl/html
          mkdir -p "$out"
          ua="Mozilla/5.0 (TorsGUI CCRL snapshot; +https://github.com/Tors3/TorsGUI-CCRL)"
          : > src-tauri/resources/ccrl/fetch.log
          for host in https://computerchess.org.uk https://computerchess.org.uk/ccrl https://ccrl.chessdom.com/ccrl; do
            for dir in 4040 404 404FRC FRC 40402 4040FRC DFRC; do
              for file in "" rating_list_all.html rating_list_pure.html rating_list_best.html; do
                url="$host/$dir/$file"
                name="$(echo "$host" | sed 's#https://##; s#/#_#g')__${dir}__${file:-index.html}"
                code=$(curl -sS -L --max-time 60 -A "$ua" -o "$out/$name" -w "%{http_code} %{url_effective}" "$url" || echo "000")
                echo "$code $url" | tee -a src-tauri/resources/ccrl/fetch.log
                case "$code" in 200*) ;; *) rm -f "$out/$name" ;; esac
              done
            done
          done
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/resources/ccrl
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "CCRL snapshot $(date -u +%Y-%m-%d)"
          git push
