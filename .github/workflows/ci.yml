name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0) from the selected branch; empty = tests and bundles only"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  FASTCHESS_TAG: v1.8.2-alpha

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Reference data (CCRL_ScirptsTests)
        uses: actions/checkout@v4
        with:
          repository: Tors3/CCRL_ScirptsTests
          path: ccrl-ref
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fastchess (Linux, built from the pinned tag)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch "$FASTCHESS_TAG" https://github.com/Disservin/fastchess.git "$RUNNER_TEMP/fastchess"
          make -C "$RUNNER_TEMP/fastchess" -j4
          echo "FASTCHESS=$RUNNER_TEMP/fastchess/fastchess" >> "$GITHUB_ENV"
      - name: Stockfish 10 (Linux, built from the reference sources)
        if: runner.os == 'Linux'
        run: |
          cp -r ccrl-ref/third_party/stockfish-10-win/src "$RUNNER_TEMP/sf10"
          make -C "$RUNNER_TEMP/sf10" -j4 build ARCH=x86-64-modern COMP=gcc
          echo "SF10=$RUNNER_TEMP/sf10/stockfish" >> "$GITHUB_ENV"
      - name: fastchess (Windows, official release)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "fastchess"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release view $env:FASTCHESS_TAG -R Disservin/fastchess --json assets -q ".assets[].name"
          gh release download $env:FASTCHESS_TAG -R Disservin/fastchess -p "*windows*" -D $dir
          Get-ChildItem $dir -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath $dir -Force }
          $exe = Get-ChildItem $dir -Recurse -Filter fastchess*.exe | Select-Object -First 1
          if (-not $exe) { throw "fastchess.exe not found in the release assets" }
          if ($exe.Name -ne "fastchess.exe") { Copy-Item $exe.FullName (Join-Path $exe.DirectoryName "fastchess.exe") }
          "FASTCHESS=$(Join-Path $exe.DirectoryName 'fastchess.exe')" | Out-File -Append $env:GITHUB_ENV
          "SF10=$env:GITHUB_WORKSPACE\ccrl-ref\third_party\stockfish-10-win\Windows\stockfish_10_x64.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Build
        run: cargo build --all-targets --locked
      - name: Tests (unit, §9 verification, bench, integration with fastchess + mock engines)
        env:
          CCRL_REF: ${{ github.workspace }}/ccrl-ref
        run: cargo test --locked --no-fail-fast -- --test-threads=2

  ui:
    name: UI (typecheck, component tests, build, Playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reference data (CCRL_ScirptsTests)
        uses: actions/checkout@v4
        with:
          repository: Tors3/CCRL_ScirptsTests
          path: ccrl-ref
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: TypeScript bindings are up to date with the Rust types
        run: |
          cargo test -p torsgui-core --lib export_bindings -q
          git diff --exit-code -- ui/src/bindings
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npx vite build
        working-directory: ui
      - name: Backend for the browser tests
        run: cargo build -p torsgui-server -p torsgui-runner -p mock-uci
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Playwright smoke test
        working-directory: ui
        env:
          CCRL_REF: ${{ github.workspace }}/ccrl-ref
        run: npx playwright test e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: ui
      - name: Reference data (CCRL_ScirptsTests)
        uses: actions/checkout@v4
        with:
          repository: Tors3/CCRL_ScirptsTests
          path: ccrl-ref
      - name: Bundled engines (Windows) — Stockfish 10 official builds, Triumviratus 7.0 AVX2
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dst = "src-tauri/resources/engines"
          Copy-Item ccrl-ref/third_party/stockfish-10-win/Windows/*.exe $dst/
          gh release download v7.0 -R Tors3/Triumviratus -p "Triumviratus_7.0_avx2.exe" -D $dst
          # every bundled file must match the hash of bundled.json
          $m = Get-Content "$dst/bundled.json" | ConvertFrom-Json
          foreach ($e in $m | Where-Object { $_.os -eq "windows" }) {
            $h = (Get-FileHash "$dst/$($e.file)" -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $e.sha256) { throw "sha256 mismatch for $($e.file): $h" }
            "$($e.file) ok ($((Get-Item "$dst/$($e.file)").Length) bytes)"
          }
      - name: Bundled engines (Linux) — Stockfish 10 built from the sf_10 sources
        if: runner.os == 'Linux'
        run: |
          cp -r ccrl-ref/third_party/stockfish-10-win/src "$RUNNER_TEMP/sf10"
          make -C "$RUNNER_TEMP/sf10" -j4 build ARCH=x86-64-modern COMP=gcc
          cp "$RUNNER_TEMP/sf10/stockfish" src-tauri/resources/engines/stockfish_10_x64_linux
          ./src-tauri/resources/engines/stockfish_10_x64_linux bench 16 1 6 > /dev/null 2>&1 || true
          ls -la src-tauri/resources/engines
      - name: Runner sidecar
        run: node ui/scripts/prepare-sidecar.mjs
      - name: Tauri bundle
        run: npx --prefix ui tauri build
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "TorsGUI-portable-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/torsgui.exe $out/TorsGUI.exe
          Copy-Item src-tauri/binaries/torsgui-runner-x86_64-pc-windows-msvc.exe $out/torsgui-runner.exe
          Copy-Item src-tauri/binaries/torsgui-demo-engine-x86_64-pc-windows-msvc.exe $out/torsgui-demo-engine.exe
          Copy-Item -Recurse src-tauri/resources/engines $out/engines
          Copy-Item -Recurse src-tauri/resources/books $out/books
          Copy-Item LICENSE $out/
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            TorsGUI-portable-windows-x64.zip
          if-no-files-found: warn

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) > files.txt
          cat files.txt
          tag="${{ inputs.release }}"
          tag="${tag:-$GITHUB_REF_NAME}"
          notes=$(awk '/^## \[/{n++} n==1' CHANGELOG.md)
          # creates the tag on this commit when it does not exist yet (manual release)
          gh release create "$tag" --target "$GITHUB_SHA" --title "TorsGUI $tag" --notes "$notes" $(cat files.txt)
